# Generated by `luma-foreman apply`. Edits are lost.
#
# Every Document that says when it applies, and what happens when it is
# not complied with. The permission gate reads the rows that block; it
# cannot be told to ignore them, and nothing in `agent-permissions`
# writes here.

[[rule]]
bundle = "lumastack/luma-catalog/luma-maintainers"
document = "policy/the-estate"
title = "The estate, and what each repository owns"
path = ".luma/bundles/lumastack/luma-catalog/luma-maintainers/policy/the-estate.md"
on_violation = "allow"
matches = ["eager"]

[[rule]]
bundle = "lumastack/luma-catalog/luma-tools"
document = "policy/what-each-tool-does"
title = "What each luma tool does"
path = ".luma/bundles/lumastack/luma-catalog/luma-tools/policy/what-each-tool-does.md"
on_violation = "allow"
matches = ["command:luma-foreman", "command:luma-catalog-curator", "topic:choosing which luma tool does a job"]
